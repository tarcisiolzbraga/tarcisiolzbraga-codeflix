plugins {
    id 'codeflix.java-conventions'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'jacoco-report-aggregation'
}

tasks.named('bootJar') {
    archiveFileName = 'application.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
}

tasks.named('jar') {
    enabled = false
}

dependencies {
    implementation project(':domain')
    implementation project(':application')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-envers'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // fora do BOM do Boot; a linha 3.x é a compatível com o Boot 4
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    // Fora do BOM do Boot: o arquivo de mídia vai para um armazenamento que fala S3.
    implementation platform('software.amazon.awssdk:bom:2.55.7')
    implementation 'software.amazon.awssdk:s3'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation testFixtures(project(':domain'))
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('bootRun') {
    workingDir = rootProject.projectDir
}

// Cobertura dos três módulos num relatório só (a infrastructure depende dos outros dois).
tasks.named('testCodeCoverageReport', JacocoReport) {
    reports {
        html.required = true
        html.outputLocation = rootProject.layout.buildDirectory.dir('reports/jacoco/html')
        xml.required = true
        xml.outputLocation = rootProject.layout.buildDirectory.file('reports/jacoco/jacoco.xml')
    }
}

// O build já roda os testes; gerar o relatório junto sai quase de graça e mantém ele atualizado.
tasks.named('check') {
    dependsOn tasks.named('testCodeCoverageReport')
}
