# Máquina do desenvolvedor: credenciais do .env (o mesmo do docker compose) e banco local.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:adm_videos}
    hikari:
      # Na máquina local, poucas conexões bastam; e conexão presa por mais de 2 s vira aviso no log.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_SIZE:5}
      leak-detection-threshold: 2000

logging:
  level:
    com.tarcisiolzbraga.codeflix.admin: debug
    org.hibernate.SQL: debug
