server:
  port: ${APP_PORT:8082}
  compression:
    enabled: true

spring:
  threads:
    virtual:
      enabled: true
  # O .env da raiz traz os valores de quem roda no host; é por isso que o bootRun usa workingDir
  # na raiz do projeto.
  config:
    import: optional:file:.env[.properties]
  elasticsearch:
    uris: ${ELASTIC_URIS:http://localhost:9201}
