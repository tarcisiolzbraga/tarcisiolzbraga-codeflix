server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      # Cada requisição roda numa virtual thread: esperar o JDBC não prende thread do SO.
      # O teto de consultas simultâneas continua sendo o pool de conexões (Hikari).
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:adm_videos}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      org.hibernate.envers.audit_table_suffix: _aud
  flyway:
    locations: classpath:db/migration
