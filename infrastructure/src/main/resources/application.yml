server:
  port: ${APP_PORT:8082}
  compression:
    enabled: true

# A API do admin-codeflix, de onde vem o registro completo depois do aviso do CDC.
admin-api:
  base-url: ${ADMIN_API_BASE_URL:http://localhost:8080}
  # O nome do registro de client OAuth2 declarado abaixo, usado pelo interceptor do RestClient.
  client-registration-id: admin-api

spring:
  threads:
    virtual:
      enabled: true
  # O .env da raiz traz os valores de quem roda no host; é por isso que o bootRun usa workingDir
  # na raiz do projeto.
  config:
    import: optional:file:.env[.properties]
  elasticsearch:
    uris: ${ELASTIC_URIS:http://localhost:9201}
  http:
    client:
      read-timeout: 1s
  security:
    oauth2:
      client:
        registration:
          admin-api:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:categories-codeflix}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            # O MESMO host que o admin usa como issuer, senão ele recusa o token: o `iss` é a
            # URL por onde o token foi pedido. Em desenvolvimento é localhost, porque as
            # aplicações rodam no host e `keycloak` só resolve dentro da rede do Docker.
            token-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8081}/realms/${KEYCLOAK_REALM:codeflix}/protocol/openid-connect/token
