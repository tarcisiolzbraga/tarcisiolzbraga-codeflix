server:
  port: ${APP_PORT:8082}
  # Mesmo prefixo da referência, e é por isso que o GraphiQL fica em /api/graphiql.
  servlet:
    context-path: /api
  compression:
    enabled: true

# A API do admin-codeflix, de onde vem o registro completo depois do aviso do CDC.
admin-api:
  base-url: ${ADMIN_API_BASE_URL:http://localhost:8080}
  # O nome do registro de client OAuth2 declarado abaixo, usado pelo interceptor do RestClient.
  client-registration-id: admin-api

kafka:
  consumers:
    category:
      id: kafka-listener-category
      topics: adm_videos_mysql.adm_videos.category
      group-id: videos-api-codeflix
      concurrency: 1
      # earliest para o snapshot inicial do Debezium ser consumido na primeira subida: com latest o
      # catálogo nasceria vazio e só veria o que mudasse a partir de então.
      auto-offset-reset: earliest
      max-attempts: 4
    cast-member:
      id: kafka-listener-cast-member
      topics: adm_videos_mysql.adm_videos.cast_member
      group-id: videos-api-codeflix
      concurrency: 1
      auto-offset-reset: earliest
      max-attempts: 4
    genre:
      id: kafka-listener-genre
      topics: adm_videos_mysql.adm_videos.genre
      group-id: videos-api-codeflix
      concurrency: 1
      auto-offset-reset: earliest
      max-attempts: 4
    video:
      id: kafka-listener-video
      topics: adm_videos_mysql.adm_videos.video
      group-id: videos-api-codeflix
      concurrency: 1
      auto-offset-reset: earliest
      max-attempts: 4

spring:
  threads:
    virtual:
      enabled: true
  # O .env da raiz traz os valores de quem roda no host; é por isso que o bootRun usa workingDir
  # na raiz do projeto.
  config:
    import: optional:file:.env[.properties]
  elasticsearch:
    uris: ${ELASTIC_URIS:http://localhost:9201}
  graphql:
    graphiql:
      # O console que serve de documentação navegável do schema, em /api/graphiql.
      enabled: ${GRAPHIQL_ENABLED:true}
  http:
    client:
      read-timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      client:
        registration:
          admin-api:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:videos-api-codeflix}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            # O MESMO host que o admin usa como issuer, senão ele recusa o token: o `iss` é a
            # URL por onde o token foi pedido. Em desenvolvimento é localhost, porque as
            # aplicações rodam no host e `keycloak` só resolve dentro da rede do Docker.
            token-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8081}/realms/${KEYCLOAK_REALM:codeflix}/protocol/openid-connect/token
