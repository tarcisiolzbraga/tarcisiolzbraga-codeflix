# Replicação da admin-api para o catálogo. Os dois serviços ficam atrás do profile "cdc": nenhuma
# das aplicações depende deles para rodar, eles existem só para alimentar a API de catálogo. Sobem
# com `docker compose --profile cdc up -d`.
#
# Nada aqui publica evento de aplicação: o Debezium se registra como réplica do MySQL e lê o
# binlog, então gravar no banco já é publicar. O código da aplicação não sabe que isto existe.
# Teto do log de cada container. Sem isto o Docker guarda o json-file sem limite nenhum, e um
# serviço em laço enche o disco: aconteceu, com 73 GB num container só.
#
# 50 MB por arquivo e 5 arquivos dão 250 MB por container — folgado para investigar um problema de
# dias atrás, e três ordens de grandeza abaixo do que um laço é capaz de escrever.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  kafka:
    logging: *logging
    image: apache/kafka:4.3.1
    container_name: adm_videos_kafka
    profiles: ["cdc"]
    environment:
      # Nó único em KRaft: o mesmo processo é broker e controller, e não há Zookeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Dois listeners de dados de propósito: INTERNAL atende quem está na rede do compose pelo nome
      # `kafka`, e EXTERNAL atende quem roda no host, como o bootRun da API de catálogo. Um listener
      # só não serve: o endereço anunciado tem de ser alcançável por quem conecta, e `kafka` não
      # resolve no host nem `localhost` dentro da rede.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      # Nó único: não há como replicar os tópicos internos em mais de uma cópia.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Sem espera artificial no primeiro consumidor a entrar no grupo.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Fixo para o cluster seguir o mesmo entre subidas; sorteado, cada recriação perderia os offsets.
      CLUSTER_ID: 2OftmwZMTJ-tjuYS48c7vg
    ports:
      - "${KAFKA_PORT}:29092"
    volumes:
      # Com volume porque os offsets do consumidor e o histórico de schema do Debezium moram aqui:
      # sem ele, cada recriação refaz o snapshot inteiro do banco.
      - kafka_data:/var/lib/kafka/data

  # A casa onde o conector do Debezium roda. A imagem do próprio Debezium já traz o conector de
  # MySQL, então não há plugin para instalar. O conector não vive em arquivo da aplicação: ele é
  # registrado na API REST da 8083, com o admin-mysql-cdc.json ao lado — veja o README.
  kafka-connect:
    logging: *logging
    image: quay.io/debezium/connect:3.6.3.Final
    container_name: adm_videos_kafka_connect
    profiles: ["cdc"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: adm_videos_connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      # Nó único, como no Kafka acima.
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "${KAFKA_CONNECT_PORT}:8083"
    depends_on:
      - kafka
      - mysql

volumes:
  kafka_data:
