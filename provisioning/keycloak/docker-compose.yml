# Autenticação. O realm, as roles e os clients vêm do realm.json ao lado, então o compose entrega
# um servidor pronto para emitir token. O realm é um só para os dois serviços — o porquê está no
# README desta pasta.
#
# Sem volume de propósito: o realm é inteiramente descrito pelo arquivo versionado, então o
# container é descartável e sempre reflete o que está no git. O que for criado à mão no console
# se perde ao recriar, o que é o comportamento desejado para uma peça de desenvolvimento.
#
# O segredo do client não fica no arquivo versionado: o Keycloak não substitui variável de
# ambiente dentro do import, então a troca é feita aqui, antes de ele ler o arquivo. A
# substituição é a do bash, que trata o valor como texto literal e não interpreta nada dele.
# Teto do log de cada container. Sem isto o Docker guarda o json-file sem limite nenhum, e um
# serviço em laço enche o disco: aconteceu, com 73 GB num container só.
#
# 50 MB por arquivo e 5 arquivos dão 250 MB por container — folgado para investigar um problema de
# dias atrás, e três ordens de grandeza abaixo do que um laço é capaz de escrever.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  keycloak:
    logging: *logging
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: adm_videos_keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # A senha do operador de teste do realm. Vem do .env pelo mesmo motivo do segredo acima:
      # credencial não entra em arquivo versionado, nem sendo de desenvolvimento.
      OPERATOR_TEST_PASSWORD: ${OPERATOR_TEST_PASSWORD:-operador-de-teste}
      # --- O banco do Keycloak -----------------------------------------------------------------
      # **Isto não é zelo: era perda de dado.** Antes o Keycloak rodava `start-dev`, cujo banco é um
      # H2 em `/opt/keycloak/data/h2/`, **dentro da camada do container** e sem volume nenhum. Toda
      # recriação apagava os assinantes criados em execução — e a linha deles em `account`, que está
      # em volume, sobrevivia: o banco e o provedor de identidade se separavam, a pessoa não
      # conseguia mais entrar, e o nome e o documento dela continuavam lá.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # O modo de produção exige HTTPS e nome de host declarado. Aqui o tráfego é interno da rede do
      # compose e o nome tem de ser o mesmo dos dois lados por causa do `iss` do token, então as duas
      # travas saem explicitamente — e não por descuido de quem copiou um exemplo.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /opt/keycloak/data/import
        template=$$(cat /realm-template.json)
        comSegredo="$${template//__KEYCLOAK_CLIENT_SECRET__/$$KEYCLOAK_CLIENT_SECRET}"
        printf '%s' "$${comSegredo//__OPERATOR_TEST_PASSWORD__/$$OPERATOR_TEST_PASSWORD}" \
          > /opt/keycloak/data/import/realm.json
        # Sem `--optimized`: o vendor de banco é opção de **tempo de build** no Keycloak, e
        # `--optimized` manda confiar numa imagem já aumentada para postgres — que esta não é. Sem a
        # flag, o próprio `start` reaumenta na subida: custa alguns segundos e dispensa manter uma
        # imagem derivada só para isso.
        exec /opt/keycloak/bin/kc.sh start --import-realm --http-port=${KEYCLOAK_PORT}
    ports:
      # A mesma porta dentro e fora de propósito: o `iss` do token é a URL que o cliente usou, então
      # http://keycloak:8081 tem de valer nos dois lados. Com portas diferentes, um token pedido do
      # host seria recusado pela aplicação dentro da rede, e vice-versa.
      - "${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"
    volumes:
      - ./realm.json:/realm-template.json:ro
    # service_healthy, e não started: o Keycloak conecta no banco na subida e sai se não conseguir.
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  # O banco do Keycloak, separado do da assinatura e do do encoder pelo mesmo motivo que aqueles são
  # separados entre si: o estado de um serviço não é assunto do outro.
  #
  # Postgres 18, e o do encoder está no 17. A divergência é deliberada e não preguiça: subir o major
  # do encoder pede dump e restauração, porque os majors do Postgres não são compatíveis no formato
  # em disco — é mudança própria, com o seu próprio teste, não carona nesta.
  keycloak-postgres:
    logging: *logging
    image: postgres:18-alpine
    container_name: adm_videos_keycloak_postgres
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
    ports:
      - "${KEYCLOAK_DB_PORT}:5432"
    # **`/var/lib/postgresql`, e não `/var/lib/postgresql/data`.** O 18 mudou isso: ele põe o PGDATA
    # numa subpasta por versão e espera um mount único no diretório de cima, para o `pg_upgrade
    # --link` de um major futuro não atravessar fronteira de mount. Com o caminho antigo a imagem
    # **recusa subir**, dizendo que o mount está "unused" — medido aqui antes de o conserto existir.
    #
    # É também a razão de o Postgres do encoder ficar no 17 nesta mudança: subir o major dele exige
    # este caminho novo **mais** dump e restauração, porque o formato em disco não é compatível.
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    # pg_isready com o usuário e o banco certos: sem -U ele usa o do sistema e responde que não está
    # pronto mesmo depois de estar.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  keycloak_postgres_data:
