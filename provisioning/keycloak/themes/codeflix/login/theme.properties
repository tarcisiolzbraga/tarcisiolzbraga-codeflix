# O tema de login da Codeflix.
#
# `parent=keycloak.v2` de propósito: a v2 é o tema moderno do Keycloak 26, e herdar dele mantém o
# **template** — o formulário, as mensagens de erro, o segundo fator, a recuperação de senha — sem
# copiar um único arquivo `.ftl`. Copiar template é o que faz tema envelhecer: a cada versão do
# Keycloak a cópia divergiria calada.
parent=keycloak.v2

# As duas folhas, nesta ordem: a do pai primeiro, a nossa depois, porque a nossa só sobrepõe cores e
# espaçamento. `css/styles.css` não existe nesta pasta — o Keycloak a resolve subindo a cadeia de
# temas até a v2.
styles=css/styles.css css/codeflix.css

# O escuro aqui não é preferência do sistema: os dois fronts da Codeflix são escuros e só, e uma
# tela de login clara entre duas escuras é um susto no meio do caminho. A folha abaixo pinta tudo
# sem depender da classe de tema escuro do PatternFly, que só entra com `prefers-color-scheme`.
darkMode=false
