// O que todo módulo tem em comum. Cada módulo aplica este plugin e declara só as próprias
// dependências.
//
// Isto fica aqui, e não num subprojects do build.gradle raiz, porque a documentação do Gradle
// desaconselha a configuração entre projetos: ela injeta comportamento que não aparece no script do
// módulo e acopla os projetos no tempo de configuração, atrapalhando otimizações como o
// configuration-on-demand.
plugins {
    id 'java'
    id 'jacoco'
}

group = 'com.tarcisiolzbraga.codeflix'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

jacoco {
    // 0.8.14 é a primeira com suporte ao Java 25 (class file 69)
    toolVersion = '0.8.15'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // O test já vem com isto; as tasks registradas abaixo nascem sem classpath nenhum, e sem isso
    // passariam verdes sem rodar nada.
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

// O test continua rodando tudo, e é ele que o build usa como porta de entrada dos commits.
// As tasks abaixo servem ao ciclo de escrita: unitTests dispensa o Docker, as outras não.
tasks.register('unitTests', Test) {
    group = 'verification'
    description = 'Roda os testes que não sobem container: domain, application e as fatias do Spring sem banco.'
    useJUnitPlatform {
        excludeTags 'integrationTest', 'e2eTest'
    }
}

tasks.register('integrationTests', Test) {
    group = 'verification'
    description = 'Roda os testes de integração, com MySQL em container.'
    useJUnitPlatform {
        includeTags 'integrationTest'
    }
}

tasks.register('e2eTests', Test) {
    group = 'verification'
    description = 'Roda as jornadas ponta a ponta, com Tomcat e MySQL de verdade.'
    useJUnitPlatform {
        includeTags 'e2eTest'
    }
}
