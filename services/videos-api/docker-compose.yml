# O catálogo servido ao usuário final. O jar vem do host: rodar `./gradlew bootJar` nesta pasta
# antes de `docker compose up -d --build videos-api`, da raiz do monorepo.
# Teto do log de cada container. Sem isto o Docker guarda o json-file sem limite nenhum, e um
# serviço em laço enche o disco: aconteceu, com 73 GB num container só.
#
# 50 MB por arquivo e 5 arquivos dão 250 MB por container — folgado para investigar um problema de
# dias atrás, e três ordens de grandeza abaixo do que um laço é capaz de escrever.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  videos-api:
    logging: *logging
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videos_api_app
    env_file:
      - ../../.env
    environment:
      # Dentro da rede do compose os serviços se acham pelo nome; o .env traz os valores de quem roda
      # no host, e estas linhas os substituem. O Keycloak não está aqui de propósito: ele é o único
      # endereçado pelo mesmo nome nos dois casos, porque o `iss` do token tem de bater.
      ELASTIC_URIS: http://catalog-elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMIN_API_BASE_URL: http://admin-api:8080
      # Em container o log estruturado sai no stdout, que é de onde o Filebeat o colhe pela label
      # abaixo. O arquivo vai para /tmp só porque o perfil development o declara.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_FILE_NAME: /tmp/videos-api.json
    ports:
      - "${CATALOG_APP_PORT}:8082"
    # A janela que o Docker dá entre o SIGTERM e o SIGKILL. O padrão dele é **10s**, e a espera da
    # aplicação por requisição em voo é de 30s: com o padrão, o que a parada elegante protege o
    # Docker corta no meio aos 10 segundos — e corta calado, porque o SIGKILL não deixa linha de
    # log. 60s põem a decisão de volta no `timeout-per-shutdown-phase`, que ao menos registra o que
    # abandonou. Parada saudável leva ~2s; este número só importa quando algo travou.
    stop_grace_period: 60s
    # A prontidão lida da porta de gerenciamento, de dentro do próprio container. Ela **não** é
    # publicada no host de propósito: o argumento do actuator numa porta à parte é que ela não sai
    # da rede, e publicá-la aqui desmontaria isso. Para ver de fora, `docker compose exec videos-api
    # wget -qO- localhost:9091/actuator/health`.
    #
    # O wget é o do busybox, que é o que a imagem Alpine tem — não há curl. Ele sai com código de
    # erro quando a resposta não é 2xx, que é justamente o que o healthcheck precisa.
    #
    # start_period generoso: o Flyway roda na subida, e falha dentro dessa janela não conta como
    # tentativa gasta. Depois dela, 3 falhas seguidas marcam o container como unhealthy.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9091/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s
    # Sem o kafka na lista de propósito, e não por esquecimento: ele está atrás do profile cdc, e
    # depender de serviço fora do profile ativo o compose recusa. Também não faria sentido — o
    # catálogo sobe e serve sem o broker, só não recebe mudança nova até o cdc subir.
    depends_on:
      - catalog-elasticsearch
      - keycloak
    labels:
      filebeat_collector: "true"
