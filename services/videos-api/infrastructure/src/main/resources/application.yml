# Configuração comum aos três perfis: development, homolog e production.
# Sem perfil ativo (bootRun, testes), vale o development; nos outros ambientes o perfil vem de
# SPRING_PROFILES_ACTIVE.
server:
  port: ${CATALOG_APP_PORT:8082}
  # Mesmo prefixo da referência, e é por isso que o GraphiQL fica em /api/graphiql.
  servlet:
    context-path: /api
  compression:
    enabled: true

# A API do admin-codeflix, de onde vem o registro completo depois do aviso do CDC.
admin-api:
  base-url: ${ADMIN_API_BASE_URL}
  # O nome do registro de client OAuth2 declarado abaixo, usado pelo interceptor do RestClient.
  client-registration-id: admin-api

# A mídia que o catálogo serve a quem assina.
#
# O segredo assina o endereço que o player usa: o `<video src>` do browser não carrega cabeçalho de
# Authorization, então a URL precisa se autorizar sozinha. Sem valor padrão aqui de propósito —
# segredo faltando derruba a subida, como no banco e no Keycloak.
media:
  signing-secret: ${CATALOG_MEDIA_SIGNING_SECRET}

kafka:
  consumers:
    category:
      id: kafka-listener-category
      topics: adm_videos_mysql.adm_videos.category
      group-id: videos-api-codeflix
      # Um por tópico: os tópicos do Debezium nascem com uma partição, e concorrência acima do
      # número de partições só deixa consumidor ocioso.
      concurrency: 1
      # earliest para o snapshot inicial do Debezium ser consumido na primeira subida: com latest o
      # catálogo nasceria vazio e só veria o que mudasse a partir de então.
      auto-offset-reset: earliest
      # 7, e não 4: o atraso dobra a cada tentativa (1s, 2s, 4s, ...), então 4 tentativas toleram
      # 7 segundos de admin fora do ar e 7 toleram 63. Um restart do admin leva ~17s medidos, e
      # tudo o que chegasse nessa janela ia direto para a fila morta — que aqui só registra em log.
      # O preço é um tópico de retentativa a mais por degrau; eles são não bloqueantes, cada um com
      # seu consumidor, então mensagem ruim demora mais para ser declarada ruim sem segurar o resto.
      max-attempts: 7
    cast-member:
      id: kafka-listener-cast-member
      topics: adm_videos_mysql.adm_videos.cast_member
      group-id: videos-api-codeflix
      concurrency: 1
      auto-offset-reset: earliest
      max-attempts: 7
    genre:
      id: kafka-listener-genre
      topics: adm_videos_mysql.adm_videos.genre
      group-id: videos-api-codeflix
      concurrency: 1
      auto-offset-reset: earliest
      max-attempts: 7
    video:
      id: kafka-listener-video
      topics: adm_videos_mysql.adm_videos.video
      group-id: videos-api-codeflix
      concurrency: 1
      auto-offset-reset: earliest
      max-attempts: 7

spring:
  profiles:
    default: development
  threads:
    virtual:
      enabled: true
  elasticsearch:
    # Os endereços vêm sem valor padrão de propósito: num serviço de leitura, apontar para um
    # Elasticsearch que não existe não dá erro visível, dá catálogo vazio — e catálogo vazio é
    # indistinguível de catálogo que ainda não replicou. Variável faltando derruba a subida.
    uris: ${ELASTIC_URIS}
  http:
    client:
      read-timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      client:
        registration:
          admin-api:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:videos-api-codeflix}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            # A URL inteira numa variável, e não montada a partir de host e porta: fora do
            # development o Keycloak atende em https, atrás de domínio próprio, sem porta.
            token-uri: ${KEYCLOAK_TOKEN_URI}

# O emissor dos tokens que o catálogo aceita. Sem valor padrão, pelo mesmo motivo dos endereços
# acima: validar token contra o emissor errado não dá erro visível, dá acesso concedido a quem não
# devia — ou negado a quem devia.
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI}

# Saúde e métricas, **numa porta à parte da aplicação**, pelo mesmo motivo da admin-api: o gateway
# publica só a porta da aplicação, então /actuator não tem por onde ser alcançado de fora. A
# proteção é a topologia, e não uma regra de caminho que alguém escreve errado um dia.
#
# A 9091 aqui, para não bater com a 9090 da admin-api nem com a 9092 da assinatura quando os três
# rodam no mesmo host pelo bootRun. A faixa é a 9090 porque a 8090 é do gateway do Istio, publicada
# no host pelo deploy/cluster/create-cluster.sh.
#
# O `context-path: /api` lá em cima **não** vale nesta porta: o servidor de gerenciamento é outro, e
# a saúde responde em /actuator/health, não em /api/actuator/health. Há teste fixando isso, porque é
# exatamente o tipo de detalhe que se descobre com a sonda falhando em produção.
management:
  server:
    port: ${CATALOG_MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        # O que se expõe é escolha, e não o padrão do Boot: saúde para as sondas e prometheus para o
        # coletor. `env` e `configprops` ficam de fora mesmo numa porta interna — eles imprimem as
        # variáveis de ambiente, e é lá que está o segredo que assina a URL da mídia.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    # O Elasticsearch entra no /actuator/health e **não** no grupo readiness. Num serviço de leitura
    # a tentação é a oposta — sem índice não há o que servir —, mas tirar todas as réplicas de
    # rotação ao mesmo tempo troca "catálogo vazio" por "nada responde", e a segunda é pior.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: videos-api-codeflix

# Identifica a aplicação no log estruturado, que é como o Kibana a separa das outras.
logging:
  structured:
    ecs:
      service:
        name: videos-api-codeflix
