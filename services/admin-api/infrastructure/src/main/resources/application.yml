# Configuração comum aos três perfis: development, homolog e production.
# Sem perfil ativo (bootRun, testes), vale o development; nos outros ambientes o perfil
# vem de SPRING_PROFILES_ACTIVE.
server:
  port: 8080

spring:
  profiles:
    default: development
  threads:
    virtual:
      # Cada requisição roda numa virtual thread: esperar o JDBC não prende thread do SO.
      # O teto de consultas simultâneas continua sendo o pool de conexões (Hikari).
      enabled: true
  datasource:
    # Sem valor padrão: fora do development, variável faltando derruba a subida em vez
    # de apontar para um banco errado.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: adm-videos-pool
      # Com virtual threads, o pool é o que limita as consultas simultâneas. Fixo (mínimo
      # igual ao máximo), como recomenda o HikariCP: nada de abrir conexão no pico.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_SIZE:20}
      # Espera máxima por uma conexão livre (ms): no pico, falha rápido em vez de enfileirar.
      connection-timeout: 2000
      # Recicla a conexão (10 min) bem antes do wait_timeout do MySQL (8 h).
      max-lifetime: 600000
      # O Hibernate controla a transação; ver provider_disables_autocommit abaixo.
      auto-commit: false
      # Recomendações do HikariCP para o MySQL Connector/J.
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        useLocalTransactionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      org.hibernate.envers.audit_table_suffix: _aud
      # O pool já entrega a conexão sem auto-commit: o Hibernate só a pega na primeira
      # consulta, não na abertura da transação.
      hibernate.connection.provider_disables_autocommit: true
      # Agrupa inserts e updates num só envio (com o rewriteBatchedStatements do driver).
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      # Carrega associações lazy em lotes, evitando o N+1.
      hibernate.default_batch_fetch_size: 16
      # IN com quantidade de parâmetros arredondada para potência de 2: menos planos em cache.
      hibernate.query.in_clause_parameter_padding: true
      # Paginar com fetch de coleção faria o Hibernate paginar em memória: vira erro.
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${AMQP_HOST}
    port: ${AMQP_PORT}
    username: ${AMQP_USER}
    password: ${AMQP_PASSWORD}
  servlet:
    multipart:
      # O arquivo enviado é lido inteiro em memória antes de ir para o armazenamento, então o teto
      # aqui é o que impede uma requisição derrubar a aplicação. Subir daqui pede envio em fluxo.
      max-file-size: ${MEDIA_MAX_FILE_SIZE:100MB}
      max-request-size: ${MEDIA_MAX_FILE_SIZE:100MB}

# Armazenamento das mídias. Como no banco, sem valor padrão: variável faltando derruba a
# subida em vez de gravar arquivo em lugar errado.
storage:
  bucket: ${STORAGE_BUCKET}
  endpoint: ${STORAGE_ENDPOINT}
  region: ${STORAGE_REGION:garage}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}

# Fila entre a aplicação e o codificador. Um exchange direto, uma fila para cada sentido:
# video.created sai daqui quando um arquivo é enviado, video.encoded volta com o resultado.
amqp:
  exchange: video.events
  queues:
    video-created:
      queue: video.created.queue
      routing-key: video.created
    video-encoded:
      queue: video.encoded.queue
      routing-key: video.encoded
  outbox:
    # De quanto em quanto tempo o relay procura o que entregar (ms) e quantas linhas leva por vez.
    poll-interval: ${OUTBOX_POLL_INTERVAL:5000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    # A linha entregue fica guardada um tempo para consulta, e depois sai: a tabela é fila, não
    # histórico — o histórico do vídeo está na auditoria dele.
    cleanup-interval: ${OUTBOX_CLEANUP_INTERVAL:3600000}
    retention: ${OUTBOX_RETENTION:7d}

# Autenticação. Como no banco e no armazenamento, sem valor padrão: variável faltando derruba a
# subida em vez de validar token contra o emissor errado.
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI}

# Saúde e métricas, **numa porta à parte da aplicação**, e essa é a decisão que importa aqui.
#
# Quem publica a porta 8080 é o gateway; a 8090 não sai do cluster. Então /actuator não tem por onde
# ser alcançado de fora, e a proteção é a topologia — não uma regra de caminho, que alguém escreve
# errado um dia e ninguém percebe até o /actuator/env estar na internet. Quem fala com esta porta é
# o orquestrador, nas sondas, e o coletor de métricas; os dois de dentro.
#
# Uma porta por serviço (9090 aqui, 9091 no catálogo, 9092 na assinatura) porque no desenvolvimento
# os três rodam no mesmo host pelo bootRun, e porta repetida só apareceria como falha na subida do
# segundo.
#
# A faixa 9090 e não uma vizinha das portas da aplicação: 8081 e 8083 são do Keycloak e do Kafka
# Connect, e a **8090 é do gateway do Istio** — o deploy/cluster/create-cluster.sh a publica no
# host, e com o cluster de pé um bootRun aqui morreria com "address already in use".
management:
  server:
    port: ${ADMIN_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        # O que se expõe é escolha, e não o padrão do Boot: saúde para as sondas e prometheus para o
        # coletor. /actuator/env e /actuator/configprops ficam de fora mesmo numa porta interna —
        # eles imprimem as variáveis de ambiente, e é lá que estão as senhas.
        include: health,info,prometheus
  endpoint:
    health:
      # Liga os grupos `liveness` e `readiness`, que são os que as sondas consultam. Sem isto os
      # dois caminhos respondem 404 e a sonda passa a medir "o Tomcat respondeu", não "a aplicação
      # está pronta".
      probes:
        enabled: true
      # Numa porta que não sai do cluster, o detalhe é o que torna a resposta útil para quem está
      # investigando: qual indicador caiu, e não só que algo caiu.
      show-details: always
  health:
    # O banco e o broker entram no /actuator/health, e **não** no grupo readiness — que é o padrão
    # do Spring, e aqui é escolha consciente. Banco fora do ar tiraria todas as réplicas de rotação
    # ao mesmo tempo, trocando uma degradação por uma queda total, e a fila de quem espera conexão
    # já falha rápido pelo connection-timeout do Hikari. Na liveness o argumento é mais forte
    # ainda: reiniciar a aplicação não traz o banco de volta, só adiciona uma subida a frio.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      # Separa as séries por aplicação no coletor, como o nome do serviço separa as linhas no Kibana.
      application: admin-codeflix

# Identifica a aplicação no log estruturado, que é como o Kibana a separa das outras.
logging:
  structured:
    ecs:
      service:
        name: admin-codeflix
