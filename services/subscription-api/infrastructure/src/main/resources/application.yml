# Configuração comum aos três perfis: development, homolog e production.
# Sem perfil ativo (bootRun, testes), vale o development; nos outros ambientes o perfil
# vem de SPRING_PROFILES_ACTIVE.
server:
  port: 8084
  # Parada elegante: o Tomcat para de aceitar conexão nova e espera a que está em voo terminar,
  # em vez de a cortar no meio. **É o padrão do Boot 4** — mudou da `immediate` do Boot 3 —, e fica
  # declarado pelo mesmo motivo do binlog-format do MySQL: para o comportamento não depender de um
  # padrão que já mudou uma vez.
  #
  # O actuator entra nisto de graça: com os grupos de sonda ligados, a prontidão passa a
  # OUT_OF_SERVICE assim que a parada começa, então o balanceador para de mandar requisição antes
  # de a aplicação começar a se desmontar.
  shutdown: graceful

spring:
  profiles:
    default: development
  # O teto de espera de cada fase da parada, e também o padrão do Boot, declarado pela mesma razão.
  # 30s é o que a requisição em voo tem para terminar; passou disso, a parada segue e o que
  # sobrou é cortado — com linha no log, que é o que diferencia isto de um SIGKILL silencioso.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      # Cada requisição roda numa virtual thread: esperar o JDBC não prende thread do SO.
      # O teto de consultas simultâneas continua sendo o pool de conexões (Hikari).
      enabled: true
  datasource:
    # Sem valor padrão: fora do development, variável faltando derruba a subida em vez
    # de apontar para um banco errado.
    url: jdbc:mysql://${SUBSCRIPTION_DB_HOST}:${SUBSCRIPTION_DB_PORT}/${SUBSCRIPTION_DB_NAME}
    username: ${SUBSCRIPTION_DB_USER}
    password: ${SUBSCRIPTION_DB_PASSWORD}
    hikari:
      pool-name: subscription-pool
      # Com virtual threads, o pool é o que limita as consultas simultâneas. Fixo (mínimo
      # igual ao máximo), como recomenda o HikariCP: nada de abrir conexão no pico.
      maximum-pool-size: ${SUBSCRIPTION_DB_POOL_SIZE:20}
      minimum-idle: ${SUBSCRIPTION_DB_POOL_SIZE:20}
      # Espera máxima por uma conexão livre (ms): no pico, falha rápido em vez de enfileirar.
      connection-timeout: 2000
      # Recicla a conexão (10 min) bem antes do wait_timeout do MySQL (8 h).
      max-lifetime: 600000
      # Ligado, ao contrário da admin-api — e a diferença é a persistência, não descuido. Lá o
      # Hibernate abre transação em toda escrita e o pool pode entregar a conexão suja; aqui não há
      # contexto de persistência, então um update solto do JdbcClient não tem quem o commite: com
      # auto-commit desligado o Hikari o desfaria ao devolver a conexão, sem erro algum no log.
      # Escrita que toca mais de uma tabela (agregado mais a fila de eventos) declara
      # @Transactional, e aí o gerenciador de transação desliga o auto-commit pelo tempo dela.
      auto-commit: true
      # Recomendações do HikariCP para o MySQL Connector/J.
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        useLocalTransactionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${AMQP_HOST}
    port: ${AMQP_PORT}
    username: ${AMQP_USER}
    password: ${AMQP_PASSWORD}
  # Só consumo: a escrita de evento vai para a tabela, e quem a leva ao Kafka é o Debezium.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Autenticação. Como no banco, sem valor padrão: variável faltando derruba a subida em vez de
# validar token contra o emissor errado.
#
# O endereço da API administrativa e o do token não aparecem aqui: são derivados do issuer-uri, para
# não haver dois lugares dizendo onde o Keycloak está.
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI}
  # A credencial com que o serviço administra os usuários do realm. O client tem as roles
  # manage-users e view-users do realm-management, e é o único com poder sobre o realm.
  admin:
    client-id: ${SUBSCRIPTION_KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    # Por nome, não por id: o id nasce na importação do realm e muda a cada recriação do container.
    # São dois grupos porque são dois acessos: ter conta aqui, e poder assistir.
    accounts-group: ${KEYCLOAK_ACCOUNTS_GROUP:accounts}
    subscribers-group: ${KEYCLOAK_SUBSCRIBERS_GROUP:subscribers}

# O que sai deste serviço: o pedido de validação de e-mail. Quem entrega é um serviço de e-mail
# próprio, do outro lado da fila — aqui não há SMTP nem template.
#
# A mesma topologia está em ../provisioning/rabbitmq/definitions.json, que o broker do compose
# carrega. Divergir faz a subida falhar com PRECONDITION_FAILED.
amqp:
  exchange: mail.events
  queues:
    sign-up-validation:
      queue: mail.signup.validation.queue
      routing-key: mail.signup.validation
  # Onde a pessoa confirma o cadastro: é a página do front, não uma rota desta API. O link do e-mail
  # leva até lá, e é o front que chama o POST de confirmar com o token.
  confirmation-url: ${SIGNUP_CONFIRMATION_URL}

# A assinatura: a tolerância antes do cancelamento e a varredura das vencidas.
#
# O cron é em UTC, o mesmo fuso do vencimento: a varredura compara datas, e rodar perto da virada do
# dia num fuso diferente faria o resultado depender de minutos.
subscription:
  tolerance-days: ${SUBSCRIPTION_TOLERANCE_DAYS:2}
  charge-job:
    cron: ${SUBSCRIPTION_CHARGE_JOB_CRON:0 0 3 * * *}
    batch-size: ${SUBSCRIPTION_CHARGE_JOB_BATCH_SIZE:100}

# O que entra neste serviço pelo CDC: a própria fila de saída, lida de volta do binlog.
#
# O nome do tópico é <topic.prefix>.<banco>.<tabela>, e tem de casar com o
# ../provisioning/cdc/subscription-mysql-cdc.json. Divergir faz o consumidor esperar por um tópico
# que nunca recebe nada — sem erro no log, que é o pior jeito de falhar.
kafka:
  consumers:
    events:
      id: kafka-listener-events
      topics: subscription_mysql.subscription.event
      group-id: subscription-api-codeflix
      # Um só: os tópicos do Debezium nascem com uma partição, e é ela que garante a ordem dos
      # eventos de uma mesma assinatura — cancelado chegando antes de renovado daria o estado errado.
      concurrency: 1
      # earliest para nenhum evento gravado antes da primeira subida do consumidor ficar sem
      # consequência: com latest, quem assinasse enquanto o consumidor estivesse fora ficaria sem
      # acesso ao catálogo para sempre.
      auto-offset-reset: earliest
      # Mesma conta da videos-api: o atraso dobra a cada tentativa, então 7 toleram 63 segundos de
      # Keycloak fora do ar. O que passar disso vai para a fila morta, que só registra em log.
      max-attempts: 7

# Saúde e métricas, **numa porta à parte da aplicação**, pelo mesmo motivo dos outros dois serviços:
# o gateway publica só a porta da aplicação, então /actuator não tem por onde ser alcançado de fora.
# A proteção é a topologia, e não uma regra de caminho que alguém escreve errado um dia.
#
# A 9092 aqui, fechando a sequência: 9090 na admin-api, 9091 no catálogo. Portas distintas porque no
# desenvolvimento os três rodam no mesmo host pelo bootRun, e a faixa é a 9090 porque a 8090 é do
# gateway do Istio, publicada no host pelo deploy/cluster/create-cluster.sh.
management:
  server:
    port: ${SUBSCRIPTION_MANAGEMENT_PORT:9092}
  endpoints:
    web:
      exposure:
        # O que se expõe é escolha, e não o padrão do Boot. Aqui `env` e `configprops` ficariam de
        # fora mesmo que a porta fosse pública: é neste serviço que mora o segredo do client que
        # administra o realm inteiro.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    # Banco e broker no /actuator/health, fora do grupo readiness — a mesma conta dos outros dois.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: subscription-codeflix

# Identifica a aplicação no log estruturado, que é como o Kibana a separa das outras.
logging:
  structured:
    ecs:
      service:
        name: subscription-codeflix
