# Homologação: espelha a produção, com variáveis de ambiente no lugar do .env,
# mas mantém o Swagger UI para quem valida a API.
# Aqui a aplicação roda em container, então o log estruturado sai no stdout, que é de onde o coletor
# o recolhe — sem arquivo, que num container seria uma camada a mais para ninguém ler. É o inverso do
# development, onde o console fica legível e o arquivo é que sai em ECS.
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: homolog
  level:
    com.tarcisiolzbraga.codeflix.subscription: info

# As origens do front que o browser confere. O localhost continua na lista de propósito: é aqui que
# se aponta um front rodando na máquina para a API de homologação, que é o teste local de verdade.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://h.tarcisiolzbraga.codeflix.com,http://localhost:3000}

# Atrás do gateway, a origem da requisição chega no X-Forwarded-For; sem isto o `getRemoteAddr()`
# devolveria o IP do gateway, e o limitador de requisição viraria um **teto global** em vez de um
# teto por origem — defeito que não aparece em teste nenhum, só em produção, como lentidão
# inexplicável para todo mundo ao mesmo tempo.
#
# Vale dizer o limite: quem controla o cabeçalho escolhe a própria chave e escapa do balde. Quem
# sanitiza o X-Forwarded-For é o gateway, e é nele que a defesa de borda mora — o filtro é a de base.
# No development isto fica desligado porque não há proxy: ali o getRemoteAddr() já é a origem real.
server:
  forward-headers-strategy: framework
