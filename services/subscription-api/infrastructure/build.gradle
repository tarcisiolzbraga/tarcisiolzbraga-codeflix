plugins {
    id 'codeflix.java-conventions'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'jacoco-report-aggregation'
    // O piso de cobertura, no build-logic: mexer nele mexe nos três serviços.
    id 'codeflix.coverage-verification'
}

tasks.named('bootJar') {
    archiveFileName = 'application.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
}

tasks.named('jar') {
    enabled = false
}

// O `amqp-client` que o BOM do Boot 4.1.2 fixa é o 5.30.0, e ele carrega quatro CVEs HIGH
// (CVE-2026-63337, -69219, -69220, -75516), corrigidos a partir do 5.33.0. Subir o Boot não resolve
// este: ele é o único dos cinco achados do Trivy que o 4.1.2 **não** move.
//
// Sobrescrever propriedade do BOM é o caminho suportado pelo plugin de dependency-management, e é
// preferível a declarar a dependência com versão: assim todo artefato do grupo continua alinhado,
// inclusive o que entrar transitivo amanhã.
ext['rabbit-amqp-client.version'] = '5.37.0'

dependencies {
    // O lz4-java vem do kafka-clients e **não é gerenciado pelo BOM do Boot**, então subir o Boot não
    // o move: o 4.1.2 trouxe o 1.11.2, que carrega o CVE-2026-106451 (corrigido no 1.11.4).
    //
    // Constraint, e não dependência declarada: ninguém aqui usa lz4 diretamente — ele é detalhe de
    // compressão do cliente Kafka. Declará-lo como dependência diria uma coisa falsa sobre o código;
    // a constraint diz exatamente o que é, um piso de versão para o que vem transitivo.
    constraints {
        implementation('at.yawk.lz4:lz4-java:1.12.1') {
            because 'CVE-2026-106451 no 1.11.2, que o kafka-clients traz'
        }
        implementation('org.xerial.snappy:snappy-java:1.1.10.12') {
            because 'CVE-2026-108106 e CVE-2026-93451 no 1.1.10.7, que o kafka-clients traz'
        }
    }
    implementation project(':domain')
    implementation project(':application')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // JDBC, e não data-jpa: os agregados daqui são persistidos por SQL escrito à mão, com o
    // JdbcClient. Não há contexto de persistência, nem entidade espelhando a tabela.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // No Boot 4 a autoconfiguração do RestClient saiu do starter de web para um módulo próprio:
    // sem ele não existe o RestClient.Builder que o cliente do Keycloak injeta.
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    // O starter, e não o spring-kafka direto: no Boot 4 é ele que traz a autoconfiguração do
    // consumidor. Mesma escolha da videos-api, que também consome CDC.
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // Saúde e métricas. O registro do Prometheus vem do BOM do Boot, por isso sem versão aqui.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // Limite de requisição. Fora do BOM do Boot: o bucket4j-core é só o algoritmo de token bucket,
    // sem integração de framework — o filtro e o registro de baldes são escritos aqui.
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    // O cache dos baldes, com teto de tamanho e expiração: sem isso o mapa de IPs cresce sem fim, e
    // uma enxurrada de origens distintas viraria vazamento de memória em vez de defesa. Vem do BOM
    // do Boot, por isso sem versão.
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    // fora do BOM do Boot; a linha 3.x é a compatível com o Boot 4
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation testFixtures(project(':domain'))
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // Fora dos starters do Boot, e nenhum dos outros dois serviços o declara: é ele que traz os
    // post-processors de requisição (jwt(), authorities()) usados para exercitar as regras de acesso
    // sem Keycloak no ar.
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.testcontainers:testcontainers-rabbitmq'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

// O CopiedSourcesTest compara as cópias que moram nos outros serviços, e o Gradle não enxerga esses
// arquivos como entrada da task: quando só eles mudam, ele considera os testes atualizados e a
// checagem passa verde sem rodar. Foi exatamente o que aconteceu ao conferir se o teste pegava uma
// divergência de verdade. Declarar as cópias como entrada devolve a verdade ao up-to-date check.
//
// O padrão casa os arquivos em vez de repetir a lista de caminhos do teste; se um caminho mudar de
// lugar, esta entrada fica vazia em silêncio, mas o teste falha dizendo que não achou a cópia.
def copiedSources = files(['admin-api', 'videos-api', 'subscription-api'].collect { service ->
    fileTree(dir: new File(rootDir.parentFile, "$service/infrastructure/src/main/java"),
            include: ['**/security/KeycloakJwtConverter.java', '**/configuration/ConfiguredValue.java',
                     '**/configuration/CorsConfig.java'])
})

// Só as tasks que rodam o teste: as de container o excluem por tag.
['test', 'unitTests'].each { name ->
    tasks.named(name, Test) {
        inputs.files(copiedSources)
                .withPropertyName('copiedSources')
                .withPathSensitivity(PathSensitivity.RELATIVE)
    }
}

tasks.named('bootRun') {
    workingDir = rootProject.projectDir
}

// Cobertura dos três módulos num relatório só (a infrastructure depende dos outros dois).
tasks.named('testCodeCoverageReport', JacocoReport) {
    reports {
        html.required = true
        html.outputLocation = rootProject.layout.buildDirectory.dir('reports/jacoco/html')
        xml.required = true
        xml.outputLocation = rootProject.layout.buildDirectory.file('reports/jacoco/jacoco.xml')
    }
}

// O build já roda os testes; gerar o relatório junto sai quase de graça e mantém ele atualizado.
tasks.named('check') {
    dependsOn tasks.named('testCodeCoverageReport')
}
