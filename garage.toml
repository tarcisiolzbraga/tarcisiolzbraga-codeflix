# Garage de desenvolvimento: um nó só, sem redundância. O segredo de RPC vem do .env
# (GARAGE_RPC_SECRET), para não ficar versionado junto da configuração.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

# Um nó não tem para onde replicar; em produção este número acompanha o tamanho do cluster.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage"
