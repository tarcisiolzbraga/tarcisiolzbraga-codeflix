# Integração contínua. Três etapas em ordem, da mais rápida para a mais cara, para o retorno de um
# erro bobo não esperar os containers subirem.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Um push novo na mesma referência cancela a execução anterior: ninguém espera resultado de código
# que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Testes sem container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Confere que o jar do wrapper é um artefato oficial do Gradle, e não algo trocado no caminho.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # unitTests é definida por exclusão de tags, então dispensa Docker e responde em segundos.
      - name: Testes unitários
        run: ./gradlew unitTests

  build:
    name: Build completo
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # O build roda os três módulos, incluindo integração e E2E, que sobem MySQL, Garage, RabbitMQ e
      # Keycloak em Testcontainers. O runner tem Docker; o custo é o download dessas imagens.
      # Os testes não precisam do .env: quem fornece credencial são os containers.
      - name: Build e todos os testes
        run: ./gradlew build

      - name: Guarda o relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: '*/build/reports/tests/**'
          retention-days: 7

  image:
    name: Imagem Docker
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # O Dockerfile empacota o jar já construído, por isso o bootJar antes.
      - name: Gera o jar
        run: ./gradlew bootJar -x test

      # Constrói sem publicar: não exige credencial nenhuma, e passa a verificar o Dockerfile, que
      # hoje não é exercitado por nada. A publicação entra quando houver registro definido.
      - name: Constrói a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: admin-codeflix:${{ github.sha }}
