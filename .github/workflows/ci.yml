# Integração contínua do monorepo. Três etapas em ordem, da mais rápida para a mais cara, para o
# retorno de um erro bobo não esperar os containers subirem.
#
# Os serviços Java entram numa matriz, e não em jobs copiados: eles têm o mesmo build, e a diferença
# é só a pasta. Os dois serviços em Go têm job próprio, e os clientes também: cada cadeia de
# ferramentas é uma — Gradle, Go e Node.
#
# Sem filtro por caminho de propósito. Filtrar teste pelo que mudou dá push verde com contrato
# quebrado: mexer só no admin-api — uma coluna renomeada, um payload diferente — quebra a videos-api,
# que replica o dado dele e captura as mensagens de CDC da saída dele. Com as suítes em minutos, sai
# mais barato rodar todas sempre. O filtro entra no dia em que houver deploy, e aí no deploy.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Um push novo na mesma referência cancela a execução anterior: ninguém espera resultado de código
# que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Testes sem container (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [admin-api, videos-api, subscription-api]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      # Confere que o jar do wrapper é um artefato oficial do Gradle, e não algo trocado no caminho.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # unitTests é definida por exclusão de tags, então dispensa Docker e responde em segundos.
      - name: Testes unitários
        run: ./gradlew unitTests

  build:
    name: Build completo (${{ matrix.service }})
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [admin-api, videos-api, subscription-api]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # O build roda os três módulos do serviço, incluindo integração e E2E, que sobem a
      # infraestrutura em Testcontainers. O runner tem Docker; o custo é o download das imagens.
      # Os testes não precisam do .env: quem fornece credencial são os containers.
      - name: Build e todos os testes
        run: ./gradlew build

      - name: Guarda o relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste-${{ matrix.service }}
          path: 'services/${{ matrix.service }}/*/build/reports/tests/**'
          retention-days: 7

  image:
    name: Imagem Docker (${{ matrix.service }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [admin-api, videos-api, subscription-api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # O Dockerfile de cada serviço empacota o jar já construído, por isso o bootJar antes.
      - name: Gera o jar
        working-directory: services/${{ matrix.service }}
        run: ./gradlew bootJar -x test

      # Constrói sem publicar: não exige credencial nenhuma, e passa a verificar os Dockerfiles, que
      # hoje não são exercitados por nada. A publicação entra quando houver registro definido.
      - name: Constrói a imagem
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:${{ github.sha }}

  # Os serviços em Go têm job próprio, e não entram nas matrizes dos de cima: a cadeia é outra —
  # Go, com o seu cache e o seu jeito de rodar teste. Não dependem do job unit porque não
  # compartilham nada com os serviços Java; o que os liga é o contrato das filas, e esse quem
  # exercita é o teste de cada lado.
  #
  # Numa matriz, e não um job por serviço: o passo é idêntico nos dois, e `make check` é a porta de
  # entrada de cada um.
  go-services:
    name: ${{ matrix.service }} (Go)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [encoder-api, mail-api]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      # O mesmo alvo que se usa na mão antes de commitar: vet e depois os testes com -race.
      - name: Verificação
        run: make check

  # Os clientes têm job próprio pelo mesmo motivo dos serviços em Go: a cadeia de ferramentas é
  # outra. `npm run check` é a porta de entrada de cada commit do portal — lint, tipos, testes e
  # build —, como o `./gradlew build` é nos Java e o `make check` nos Go.
  #
  # Os dois clientes na mesma matriz: o portal (Next) e o back-office (Vite) expõem o mesmo
  # `npm run check`, então o job não precisa saber qual é qual.
  clients:
    name: ${{ matrix.client }} (front)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [portal-codeflix, back-office-codeflix]
    defaults:
      run:
        working-directory: clients/${{ matrix.client }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: clients/${{ matrix.client }}/.nvmrc
          cache: npm
          cache-dependency-path: clients/${{ matrix.client }}/package-lock.json

      # npm ci, e não npm install: respeita o package-lock e falha se ele estiver fora de sincronia,
      # em vez de resolver versão nova sem ninguém pedir.
      - name: Instala as dependências
        run: npm ci

      # A telemetria do Next é ligada por padrão e manda dado de build para fora. Aqui ela fica
      # desligada: o que sai do CI é escolha, não padrão herdado. Para o back-office a variável não
      # faz nada — o Vite não tem telemetria.
      - name: Verificação
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run check

      # Constrói sem publicar, como nas aplicações Java: não exige credencial nenhuma, e passa a
      # verificar os Dockerfiles dos fronts, que de outro modo só seriam exercitados na máquina de
      # quem os escreveu. Sem `build-args`: a imagem do CI é a de desenvolvimento, e o que está sob
      # teste é o Dockerfile, não a URL.
      - name: Constrói a imagem
        uses: docker/build-push-action@v6
        with:
          context: clients/${{ matrix.client }}
          push: false
          tags: ${{ matrix.client }}:${{ github.sha }}
