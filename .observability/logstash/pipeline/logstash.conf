input {
  beats {
    port => 5044
  }
}

filter {
  # As mensagens da aplicação carregam pares no formato [chave:valor], como
  # "[message:video.encoded] [status:unreadable] [payload:...]". O kv os transforma em campos de
  # verdade, para dar para filtrar por status no Kibana em vez de procurar texto.
  kv {
    source => "message"
    field_split_pattern => "\] \["
    value_split => ":"
    trim_key => "\[\]"
    trim_value => "\[\]"
    prefix => "evento_"
    remove_char_key => " "
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "admin-codeflix-%{+YYYY.MM.dd}"
  }
}
