# A infraestrutura do monorepo, montada por inclusão: este arquivo não declara serviço nenhum, só
# aponta para o compose de cada parte. Cada container mora ao lado dos arquivos que monta, e o .env
# da raiz vale para todos — o compose o lê uma vez e interpola nos incluídos.
#
# Os profiles mantêm o `docker compose up -d` do dia a dia enxuto:
#   (sem profile)            MySQL, RabbitMQ, Garage, Keycloak, o Elasticsearch do catálogo, o
#                            MySQL da assinatura, o coletor de e-mail e as aplicações
#   --profile cdc            Kafka e Kafka Connect, que alimentam o catálogo
#   --profile observability  Elasticsearch de log, Kibana, Logstash e Filebeat
#
# O serviço de e-mail e o encoder são em Go e compilam dentro da própria imagem; só as três
# aplicações Java empacotam o jar no host, então antes de subi-las rode o bootJar da pasta
# de cada uma. Para subir só a infraestrutura, nomeie os serviços:
#   docker compose up -d mysql rabbitmq garage keycloak catalog-elasticsearch
include:
  # os containers de apoio, que por sua vez incluem um compose por parte
  - path: provisioning/docker-compose.yml

  # as aplicações, cada uma com o compose ao lado do próprio Dockerfile
  - path: admin-api/docker-compose.yml
  - path: videos-api/docker-compose.yml
  - path: encoder-api/docker-compose.yml
  - path: subscription-api/docker-compose.yml
  - path: mail-api/docker-compose.yml
