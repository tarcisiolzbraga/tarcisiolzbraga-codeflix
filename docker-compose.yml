services:
  mysql:
    image: mysql:8.4
    container_name: adm_videos_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Armazenamento das mídias, compatível com S3. --single-node monta o layout sozinho e
  # --default-bucket cria o bucket e a chave com as credenciais abaixo; sem isso o Garage
  # sobe sem layout e recusa toda requisição. A permissão é por chave e por bucket.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: adm_videos_garage
    entrypoint: ["/garage"]
    command: ["server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${STORAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${STORAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${STORAGE_BUCKET}
    ports:
      - "${STORAGE_PORT}:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  # Fila entre a aplicação e o codificador de vídeo. A imagem -management traz o painel em
  # http://localhost:15672, útil para ver mensagem parada durante o desenvolvimento.
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: adm_videos_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${AMQP_USER}
      RABBITMQ_DEFAULT_PASS: ${AMQP_PASSWORD}
    ports:
      - "${AMQP_PORT}:5672"
      - "${AMQP_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Autenticação. O realm, as roles e o client vêm de .keycloak/realm.json, importado na subida,
  # então o compose entrega um servidor pronto para emitir token.
  #
  # Sem volume de propósito: o realm é inteiramente descrito pelo arquivo versionado, então o
  # container é descartável e sempre reflete o que está no git. O que for criado à mão no console
  # se perde ao recriar, o que é o comportamento desejado para uma peça de desenvolvimento.
  #
  # O segredo do client não fica no arquivo versionado: o Keycloak não substitui variável de
  # ambiente dentro do import, então a troca é feita aqui, antes de ele ler o arquivo. A
  # substituição é a do bash, que trata o valor como texto literal e não interpreta nada dele.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: adm_videos_keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /opt/keycloak/data/import
        template=$$(cat /realm-template.json)
        printf '%s' "$${template//__KEYCLOAK_CLIENT_SECRET__/$$KEYCLOAK_CLIENT_SECRET}" \
          > /opt/keycloak/data/import/realm.json
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./.keycloak/realm.json:/realm-template.json:ro

volumes:
  mysql_data:
  garage_meta:
  garage_data:
  rabbitmq_data:
