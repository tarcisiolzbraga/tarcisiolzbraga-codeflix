services:
  mysql:
    image: mysql:8.4
    container_name: adm_videos_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Armazenamento das mídias, compatível com S3. --single-node monta o layout sozinho e
  # --default-bucket cria o bucket e a chave com as credenciais abaixo; sem isso o Garage
  # sobe sem layout e recusa toda requisição. A permissão é por chave e por bucket.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: adm_videos_garage
    entrypoint: ["/garage"]
    command: ["server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${STORAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${STORAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${STORAGE_BUCKET}
    ports:
      - "${STORAGE_PORT}:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  # Fila entre a aplicação e o codificador de vídeo. A imagem -management traz o painel em
  # http://localhost:15672, útil para ver mensagem parada durante o desenvolvimento.
  #
  # O nó sobe com o exchange, as duas filas, os dois bindings e o usuário já criados, vindos de
  # .rabbitmq/definitions.json. Havendo definitions, o RabbitMQ não cria o usuário de
  # RABBITMQ_DEFAULT_USER, então o usuário também vem do arquivo — e por isso o nome e a senha são
  # trocados aqui, antes da subida, com os valores do .env. A substituição é a do bash, que trata
  # os valores como texto literal.
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: adm_videos_rabbitmq
    environment:
      AMQP_USER: ${AMQP_USER}
      AMQP_PASSWORD: ${AMQP_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        template=$$(cat /definitions-template.json)
        template=$${template//__AMQP_USER__/$$AMQP_USER}
        printf '%s' "$${template//__AMQP_PASSWORD__/$$AMQP_PASSWORD}" \
          > /etc/rabbitmq/definitions.json
        exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server
    ports:
      - "${AMQP_PORT}:5672"
      - "${AMQP_MANAGEMENT_PORT}:15672"
    volumes:
      - ./.rabbitmq/definitions.json:/definitions-template.json:ro
      - ./.rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq

  # Autenticação. O realm, as roles e o client vêm de .keycloak/realm.json, importado na subida,
  # então o compose entrega um servidor pronto para emitir token.
  #
  # Sem volume de propósito: o realm é inteiramente descrito pelo arquivo versionado, então o
  # container é descartável e sempre reflete o que está no git. O que for criado à mão no console
  # se perde ao recriar, o que é o comportamento desejado para uma peça de desenvolvimento.
  #
  # O segredo do client não fica no arquivo versionado: o Keycloak não substitui variável de
  # ambiente dentro do import, então a troca é feita aqui, antes de ele ler o arquivo. A
  # substituição é a do bash, que trata o valor como texto literal e não interpreta nada dele.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: adm_videos_keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /opt/keycloak/data/import
        template=$$(cat /realm-template.json)
        printf '%s' "$${template//__KEYCLOAK_CLIENT_SECRET__/$$KEYCLOAK_CLIENT_SECRET}" \
          > /opt/keycloak/data/import/realm.json
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm --http-port=${KEYCLOAK_PORT}
    ports:
      # A mesma porta dentro e fora de propósito: o `iss` do token é a URL que o cliente usou, então
      # http://keycloak:8081 tem de valer nos dois lados. Com portas diferentes, um token pedido do
      # host seria recusado pela aplicação dentro da rede, e vice-versa.
      - "${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"
    volumes:
      - ./.keycloak/realm.json:/realm-template.json:ro

  # A aplicação. O jar vem do host: rodar `./gradlew bootJar` antes de `docker compose up -d --build`.
  # Fica no mesmo compose dos outros para `depends_on` e nomes de serviço valerem.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adm_videos_app
    env_file:
      - .env
    environment:
      # Dentro da rede do compose os serviços se acham pelo nome; o .env traz os valores de quem roda
      # no host, e estas linhas os substituem. O Keycloak não está aqui de propósito: ele é o único
      # endereçado pelo mesmo nome nos dois casos, porque o `iss` do token tem de bater — veja o
      # KEYCLOAK_HOST no .env.example.
      DB_HOST: mysql
      DB_PORT: 3306
      AMQP_HOST: rabbitmq
      AMQP_PORT: 5672
      STORAGE_HOST: garage
      # Em container o log estruturado sai no stdout, que é de onde o Filebeat o colhe pela label
      # abaixo. O arquivo vai para /tmp só porque o perfil development o declara.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_FILE_NAME: /tmp/admin-codeflix.json
      # suspend=n para a aplicação subir sem esperar o depurador.
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "${APP_PORT}:8080"
      - "${APP_DEBUG_PORT}:5005"
    depends_on:
      - mysql
      - rabbitmq
      - garage
      - keycloak
    labels:
      filebeat_collector: "true"

  # --- Observabilidade -------------------------------------------------------------------------
  # Os quatro serviços abaixo ficam atrás do profile "observability": o `docker compose up -d` do
  # dia a dia segue subindo só os quatro de cima, e a pilha entra sob demanda com
  # `docker compose --profile observability up -d`. O Elasticsearch sozinho quer meio giga de heap.
  #
  # Uma rede à parte não é necessária: a rede padrão do projeto já liga todos pelo nome do serviço.

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: adm_videos_elasticsearch
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      # Desenvolvimento: sem TLS nem senha, para o Kibana e o Logstash falarem direto.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTIC_PORT}:9200"
    volumes:
      # Com volume porque os objetos salvos do Kibana, inclusive a data view, moram aqui: sem ele
      # você os recria a cada subida.
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    container_name: adm_videos_kibana
    profiles: ["observability"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT}:5601"
    depends_on:
      - elasticsearch

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.4
    container_name: adm_videos_logstash
    profiles: ["observability"]
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      xpack.monitoring.enabled: "false"
    volumes:
      - ./.observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.4
    container_name: adm_videos_filebeat
    profiles: ["observability"]
    # strict.perms desligado porque o arquivo de configuração vem montado do repositório, e o
    # Filebeat recusa configuração que não seja dele.
    command: ["--strict.perms=false"]
    volumes:
      - ./.observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # O arquivo que o bootRun escreve, que roda com workingDir na raiz do projeto.
      - ./build/logs:/logs:ro
      # Onde o Filebeat guarda até onde já leu. Sem este volume o registro morre com o container, e
      # um down/up relê o arquivo inteiro: medido, 154 documentos viraram 308.
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - logstash

volumes:
  mysql_data:
  garage_meta:
  garage_data:
  rabbitmq_data:
  elasticsearch_data:
  filebeat_data:
