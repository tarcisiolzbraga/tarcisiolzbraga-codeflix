# Máquina do desenvolvedor: credenciais do .env (o mesmo do docker compose), o Elasticsearch daqui
# e o Kafka que o compose do admin-codeflix sobe com --profile cdc.
spring:
  # O .env da raiz do monorepo, que é o mesmo do docker compose e o mesmo da admin-api: com um
  # arquivo só, KEYCLOAK_HOST não pode divergir entre os dois lados, e era a divergência dele que
  # fazia o admin recusar o token pelo `iss`. O caminho é relativo porque o bootRun roda com
  # workingDir na pasta do serviço.
  config:
    import: optional:file:../.env[.properties]
  elasticsearch:
    uris: ${ELASTIC_URIS:http://localhost:9201}
  graphql:
    graphiql:
      # O console que serve de documentação navegável do schema, em /api/graphiql.
      enabled: ${GRAPHIQL_ENABLED:true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
  security:
    oauth2:
      client:
        provider:
          keycloak:
            # O MESMO host que o admin usa como issuer, senão ele recusa o token: o `iss` é a
            # URL por onde o token foi pedido. Em desenvolvimento é localhost, porque as
            # aplicações rodam no host e `keycloak` só resolve dentro da rede do Docker.
            token-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8081}/realms/${KEYCLOAK_REALM:codeflix}/protocol/openid-connect/token

admin-api:
  base-url: ${ADMIN_API_BASE_URL:http://localhost:8080}

# O Keycloak do docker compose do admin-codeflix, montado das mesmas variáveis que o token-uri
# acima: o emissor que o catálogo valida é o mesmo de quem pede o token.
keycloak:
  issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8081}/realms/${KEYCLOAK_REALM:codeflix}

# O console segue legível para quem está desenvolvendo, e o arquivo sai em ECS, o esquema da própria
# Elastic — é dele que o Filebeat se alimenta. O Boot 4 formata sozinho: nada de logback-spring.xml
# nem de encoder a mais no classpath.
#
# Só no development: em homolog e produção quem recolhe o log é a plataforma, a partir do stdout, e
# essa decisão é outra.
logging:
  file:
    name: ${LOG_FILE:build/logs/videos-api-codeflix.json}
  structured:
    format:
      file: ecs
    ecs:
      service:
        environment: development
  level:
    com.tarcisiolzbraga.codeflix.videos: debug
