// O que todo módulo de todo serviço tem em comum. Cada módulo aplica este plugin e declara só as
// próprias dependências.
//
// Isto fica aqui, e não num subprojects do build.gradle raiz, porque a documentação do Gradle
// desaconselha a configuração entre projetos: ela injeta comportamento que não aparece no script do
// módulo e acopla os projetos no tempo de configuração, atrapalhando otimizações como o
// configuration-on-demand.
plugins {
    id 'java'
    id 'jacoco'
}

group = 'com.tarcisiolzbraga.codeflix'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

jacoco {
    // 0.8.14 é a primeira com suporte ao Java 25 (class file 69)
    toolVersion = '0.8.15'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // O test já vem com isto; as tasks registradas abaixo nascem sem classpath nenhum, e sem isso
    // passariam verdes sem rodar nada.
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // A raiz do build do serviço, para o teste achar os arquivos de provisionamento dos containers
    // (como o realm do Keycloak, que fica na raiz do monorepo) sem depender de caminho relativo ao
    // módulo.
    systemProperty 'codeflix.rootDir', rootDir.absolutePath
}

// O `test` roda tudo **menos** o estresse, e é ele que o `build` usa. A exclusão é o ponto: o teste
// de estresse mede uma corrida, então ele falha por projeto quando a corrida acontece — pô-lo no
// caminho de todo commit transformaria o build num sorteio, que é o problema que ele existe para
// investigar.
//
// A exclusão fica **aqui, no `test`**, e não num `tasks.withType(Test).configureEach`: ali ela
// alcançaria o próprio `stressTests`, e o Gradle avisa o que acontece — "the tag 'stressTest' is
// both included and excluded... will result in the tag being excluded". A task passava verde em 4
// segundos sem rodar nada.
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'stressTest'
    }
}

// O test continua rodando tudo o mais, e é ele que o build usa como porta de entrada dos commits.
// As tasks abaixo servem ao ciclo de escrita: unitTests dispensa o Docker, as outras não.
tasks.register('unitTests', Test) {
    group = 'verification'
    description = 'Roda os testes que não sobem container: domain, application e as fatias do Spring sem infraestrutura.'
    useJUnitPlatform {
        excludeTags 'integrationTest', 'e2eTest', 'stressTest'
    }
}

tasks.register('integrationTests', Test) {
    group = 'verification'
    description = 'Roda os testes de integração, com a infraestrutura em container.'
    useJUnitPlatform {
        includeTags 'integrationTest'
    }
}

tasks.register('e2eTests', Test) {
    group = 'verification'
    description = 'Roda as jornadas ponta a ponta, com Tomcat e infraestrutura de verdade.'
    useJUnitPlatform {
        includeTags 'e2eTest'
    }
}

// Fora do `build` de propósito, e só roda quando alguém o chama pelo nome.
//
// Ele não verifica comportamento: **mede uma taxa de falha**. A intermitência do fluxo de mídia
// aparece em cerca de 1 commit em 4 no CI, e o README da admin-api registra que "um build verde não
// prova nada" — quatro builds inteiros verdes já conviveram com CI vermelho. Sem um instrumento que
// reproduza sob demanda, nenhuma tentativa de conserto é avaliável.
//
// `--rerun` porque o Gradle consideraria a task atualizada e a saltaria na segunda chamada, e repetir
// é exatamente o que se quer aqui.
tasks.register('stressTests', Test) {
    group = 'verification'
    description = 'Mede a taxa de falha do fluxo de mídia sob carga. Fora do build; chame pelo nome.'
    useJUnitPlatform {
        includeTags 'stressTest'
    }
    // Repassa os `-Dstress.*` para o JVM de teste. Sem isto o `-Dstress.threads=32` da linha de
    // comando ficaria no JVM do Gradle, o teste leria o padrão e a execução pareceria obedecer sem
    // obedecer — o pior tipo de parâmetro, o que mente.
    systemProperties System.properties.findAll { chave, valor -> chave.toString().startsWith('stress.') }
    // Repetir é exatamente o que se quer aqui: sem isto o Gradle consideraria a task atualizada e a
    // saltaria na segunda chamada.
    outputs.upToDateWhen { false }
}
