# O back-office é um pacote estático: o Vite não tem servidor, e não há nada para renderizar no
# servidor — tudo atrás da porta exige login.
server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;

    # **A linha que faz o roteador funcionar.** O react-router usa caminhos de verdade
    # (`/categorias/novo`), e recarregar a página nessa URL pede ao nginx um arquivo que não existe.
    # Sem o fallback, a resposta é 404 — e parece defeito da aplicação, não do servidor.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os pacotes têm hash no nome, então podem ser guardados para sempre. O `index.html` não tem, e
    # guardá-lo faria uma versão nova demorar a aparecer.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
