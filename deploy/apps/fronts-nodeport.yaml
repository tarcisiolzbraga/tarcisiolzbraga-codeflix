# Os dois fronts publicados em `localhost:3000` e `localhost:3001`, **fora** do gateway.
#
# Isto não é inconsistência: é o que o login exige. O `oidc-client-ts` calcula o desafio PKCE S256
# com `crypto.subtle`, e `crypto.subtle` **só existe em contexto seguro** — HTTPS, ou um endereço que
# o navegador considere loopback. Servido como `http://admin.localtest.me`, o painel morria com
# "Crypto.subtle is available only in secure contexts (HTTPS)" antes de redirecionar para o Keycloak.
#
# As APIs e o Keycloak continuam atrás do gateway, em `*.localtest.me`: nenhum dos dois precisa de
# contexto seguro, e é esse nome que mantém o `iss` do token igual por dentro e por fora.
#
# `k3d cluster edit codeflix --port-add "3000:30000@loadbalancer" --port-add "3001:30001@loadbalancer"`
# é o que liga a porta do host a estes NodePorts; está no create-cluster.sh.
apiVersion: v1
kind: Service
metadata:
  name: portal-nodeport
  namespace: codeflix
  labels: { app: portal }
spec:
  type: NodePort
  selector: { app: portal }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 30000 }
---
apiVersion: v1
kind: Service
metadata:
  name: back-office-nodeport
  namespace: codeflix
  labels: { app: back-office }
spec:
  type: NodePort
  selector: { app: back-office }
  ports:
    - { name: http, port: 3001, targetPort: 3001, nodePort: 30001 }
