# A identidade de cada carga na malha.
#
# **Por que isto existe.** Os 18 workloads rodavam com o service account `default`, e isso só aparece
# quando se tenta escrever a primeira `AuthorizationPolicy`: o certificado que o istiod emite carrega
# a identidade do service account, então com `default` em todos eles o certificado de **todo** pod
# dizia a mesma coisa —
#
#     cluster.local/ns/codeflix/sa/default
#
# — e "apenas o catálogo pode chamar o admin" era inexprimível. Dava para dizer "alguém da malha", e
# nada além.
#
# O mTLS `STRICT` que entrou antes disto continua valendo o que vale: ele cifra e exige certificado.
# O que ele **não** dava, sozinho, era identidade por carga — e é ela que a política consome.
#
# **Um por workload, com o mesmo nome do Deployment**, para não haver mapa a consultar: o principal
# de cada um é `cluster.local/ns/codeflix/sa/<nome do deployment>`.
#
# Nenhum deles recebe permissão de API do Kubernetes. Service account aqui é **só** identidade de
# rede; dar `automountServiceAccountToken: false` seria o passo seguinte, e é outro assunto — o token
# montado não é o que a malha usa.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-api
  namespace: codeflix

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: back-office
  namespace: codeflix

