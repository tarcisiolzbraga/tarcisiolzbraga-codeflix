# As rotas do gateway: um nome por coisa que o browser alcança.
#
# `mesh` entra na lista de gateways de cada rota junto do `codeflix` porque os mesmos nomes são
# usados **de dentro** — o portal busca os planos pelo servidor, e as imagens dos fronts têm esses
# endereços embutidos. Sem `mesh`, a chamada de um pod ao mesmo nome sairia da malha e voltaria como
# tráfego externo, e o Kiali a desenharia vindo da internet.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: { name: portal, namespace: codeflix }
spec:
  hosts: ["codeflix.localtest.me"]
  gateways: [codeflix, mesh]
  http:
    - route:
        - destination: { host: portal.codeflix.svc.cluster.local, port: { number: 3000 } }
---
