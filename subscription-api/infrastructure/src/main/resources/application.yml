# Configuração comum aos três perfis: development, homolog e production.
# Sem perfil ativo (bootRun, testes), vale o development; nos outros ambientes o perfil
# vem de SPRING_PROFILES_ACTIVE.
server:
  port: 8084

spring:
  profiles:
    default: development
  threads:
    virtual:
      # Cada requisição roda numa virtual thread: esperar o JDBC não prende thread do SO.
      # O teto de consultas simultâneas continua sendo o pool de conexões (Hikari).
      enabled: true
  datasource:
    # Sem valor padrão: fora do development, variável faltando derruba a subida em vez
    # de apontar para um banco errado.
    url: jdbc:mysql://${SUBSCRIPTION_DB_HOST}:${SUBSCRIPTION_DB_PORT}/${SUBSCRIPTION_DB_NAME}
    username: ${SUBSCRIPTION_DB_USER}
    password: ${SUBSCRIPTION_DB_PASSWORD}
    hikari:
      pool-name: subscription-pool
      # Com virtual threads, o pool é o que limita as consultas simultâneas. Fixo (mínimo
      # igual ao máximo), como recomenda o HikariCP: nada de abrir conexão no pico.
      maximum-pool-size: ${SUBSCRIPTION_DB_POOL_SIZE:20}
      minimum-idle: ${SUBSCRIPTION_DB_POOL_SIZE:20}
      # Espera máxima por uma conexão livre (ms): no pico, falha rápido em vez de enfileirar.
      connection-timeout: 2000
      # Recicla a conexão (10 min) bem antes do wait_timeout do MySQL (8 h).
      max-lifetime: 600000
      # Ligado, ao contrário da admin-api — e a diferença é a persistência, não descuido. Lá o
      # Hibernate abre transação em toda escrita e o pool pode entregar a conexão suja; aqui não há
      # contexto de persistência, então um update solto do JdbcClient não tem quem o commite: com
      # auto-commit desligado o Hikari o desfaria ao devolver a conexão, sem erro algum no log.
      # Escrita que toca mais de uma tabela (agregado mais a fila de eventos) declara
      # @Transactional, e aí o gerenciador de transação desliga o auto-commit pelo tempo dela.
      auto-commit: true
      # Recomendações do HikariCP para o MySQL Connector/J.
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        useLocalTransactionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${AMQP_HOST}
    port: ${AMQP_PORT}
    username: ${AMQP_USER}
    password: ${AMQP_PASSWORD}

# Autenticação. Como no banco, sem valor padrão: variável faltando derruba a subida em vez de
# validar token contra o emissor errado.
#
# O endereço da API administrativa e o do token não aparecem aqui: são derivados do issuer-uri, para
# não haver dois lugares dizendo onde o Keycloak está.
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI}
  # A credencial com que o serviço administra os usuários do realm. O client tem as roles
  # manage-users e view-users do realm-management, e é o único com poder sobre o realm.
  admin:
    client-id: ${SUBSCRIPTION_KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    # Por nome, não por id: o id nasce na importação do realm e muda a cada recriação do container.
    subscribers-group: ${KEYCLOAK_SUBSCRIBERS_GROUP:subscribers}

# O que sai deste serviço: o pedido de validação de e-mail. Quem entrega é um serviço de e-mail
# próprio, do outro lado da fila — aqui não há SMTP nem template.
#
# A mesma topologia está em ../provisioning/rabbitmq/definitions.json, que o broker do compose
# carrega. Divergir faz a subida falhar com PRECONDITION_FAILED.
amqp:
  exchange: mail.events
  queues:
    sign-up-validation:
      queue: mail.signup.validation.queue
      routing-key: mail.signup.validation
  # Onde a pessoa confirma o cadastro: é a página do front, não uma rota desta API. O link do e-mail
  # leva até lá, e é o front que chama o POST de confirmar com o token.
  confirmation-url: ${SIGNUP_CONFIRMATION_URL}

# Identifica a aplicação no log estruturado, que é como o Kibana a separa das outras.
logging:
  structured:
    ecs:
      service:
        name: subscription-codeflix
